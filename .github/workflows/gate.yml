name: gate
on: [push, workflow_dispatch]
jobs:
  witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - name: proof-of-play — the number at the bottom of the document
        run: node invoice.test.mjs

      # Pinned. An unpinned gate is a gate somebody else can change.
      - name: witness — try to break the tests
        run: |
          git clone --depth 1 --branch v0.2 https://github.com/sjgant80-hub/witness.git /tmp/witness
          node /tmp/witness/witness.mjs mutate invoice.mjs \
            --cap 400 --baseline witness.invoice.baseline.json --test "node invoice.test.mjs"

      - name: the shipped page still matches the gated kernel
        run: |
          cp index.html /tmp/shipped.html
          node build-page.mjs
          diff -q /tmp/shipped.html index.html || {
            echo "::error::index.html has drifted from invoice.mjs — run build-page.mjs and commit."; exit 1; }

      # ⚑ One sum. The guards below are checked against the built page locally before being written
      # here, so they cannot trip on a comment that merely describes the old code.
      - name: one sum, and the pay link reads it
        run: |
          grep -q 'INV.totalsOf' index.html || { echo '::error::the totals are not coming from the kernel'; exit 1; }
          grep -qF '(Number(l.qty)||0) * (Number(l.rate)||0)' index.html && { echo '::error::a second copy of the subtotal is back'; exit 1; }
          grep -qF 'total.toFixed(2)' index.html && { echo '::error::the pay link is formatting money without asking the currency'; exit 1; }
          echo ok
